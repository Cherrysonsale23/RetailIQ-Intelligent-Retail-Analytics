[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-analytics-api"
version = "0.1.0"
description = "FastAPI backend for the Meridian e-commerce analytics platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "polars>=1.24,<2", "pyarrow>=19,<30", "scipy>=1.15,<2", "scikit-learn>=1.6,<2"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
